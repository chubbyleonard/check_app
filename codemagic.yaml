workflows:
  ios-sideloadly:
    name: Flutter iOS (Sideloadly)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build unsigned IPA for Sideloadly
        script: |
          # Build without code signing
          flutter build ios --release --no-codesign

          # Create a proper IPA from the .app
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qr ../Runner.ipa Payload
    artifacts:
      - build/ios/Runner.ipa